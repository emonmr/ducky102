<nav class="navbar navbar-expand bg-body-tertiary border-bottom sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" routerLink="/">
      <i class="bi bi-lightning-charge-fill text-primary me-1" aria-hidden="true"></i>{{ title }}
    </a>
    <ul class="navbar-nav me-auto">
      @if (auth.isAuthenticated()) {
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/users"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
          >
            Users
          </a>
        </li>
      }
    </ul>

    <div class="d-flex align-items-center gap-2">
      @if (auth.isAuthenticated()) {
        <span class="navbar-text d-none d-sm-inline">
          <i class="bi bi-person-circle me-1" aria-hidden="true"></i>{{ auth.displayName() }}
        </span>
        <button type="button" class="btn btn-outline-secondary btn-sm" (click)="auth.logout()">
          <i class="bi bi-box-arrow-right me-1" aria-hidden="true"></i>Sign out
        </button>
      } @else {
        <a class="btn btn-primary btn-sm" routerLink="/auth/login">Sign in</a>
      }

      <button
        type="button"
        class="btn btn-outline-secondary btn-sm"
        [attr.aria-label]="
          theme.mode() === 'light' ? 'Switch to dark mode' : 'Switch to light mode'
        "
        (click)="theme.toggle()"
      >
        <i
          class="bi"
          [class]="theme.mode() === 'light' ? 'bi-moon-stars' : 'bi-sun'"
          aria-hidden="true"
        ></i>
      </button>
    </div>
  </div>
</nav>

<main>
  <router-outlet />
</main>

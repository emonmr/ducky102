<app-auth-card
  title="Forgot your password?"
  subtitle="Enter your email and we'll send you a reset link"
>
  @if (store.notice(); as notice) {
    <div class="alert alert-success d-flex align-items-center gap-2 py-2 mb-0" role="status">
      <i class="bi bi-envelope-check-fill" aria-hidden="true"></i>
      <span>{{ notice }}</span>
    </div>
  } @else {
    @if (store.error(); as error) {
      <div class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
        <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
        <span>{{ error }}</span>
      </div>
    }

    <form [formRoot]="forgotForm">
      <div class="mb-3">
        <label for="forgot-email" class="form-label">Email</label>
        <input
          id="forgot-email"
          type="email"
          class="form-control"
          autocomplete="email"
          [class.is-invalid]="forgotForm.email().touched() && forgotForm.email().invalid()"
          [formField]="forgotForm.email"
        />
        @if (forgotForm.email().touched() && forgotForm.email().errors().length) {
          <div class="invalid-feedback">{{ forgotForm.email().errors()[0].message }}</div>
        }
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="store.loading()">
        @if (store.loading()) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
          Sending…
        } @else {
          Send reset link
        }
      </button>
    </form>
  }

  <p authFooter class="mb-0">
    <a routerLink="/auth/login"
      ><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Back to sign in</a
    >
  </p>
</app-auth-card>
